name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: detecttrace validate examples/powershell/detectspec.yaml
      - run: detecttrace test examples/powershell/detectspec.yaml --profile healthy
