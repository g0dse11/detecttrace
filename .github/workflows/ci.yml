name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install DetectTrace and CI test reporter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install unittest-xml-reporting

      - name: Run unit and regression tests
        run: |
          python -m xmlrunner discover -s tests -o test-results -v

      - name: Validate example DetectSpec
        run: |
          detecttrace validate examples/powershell/detectspec.yaml

      - name: Run healthy offline example
        run: |
          detecttrace test examples/powershell/detectspec.yaml --profile healthy

      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-python-${{ matrix.python-version }}
          path: test-results/*.xml
          if-no-files-found: warn
          retention-days: 7
